<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="R learning path">
<rect width="960" height="540" rx="24" fill="#f4f7f5"/>
<text x="480" y="64" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#1a2e24">R learning path</text>
<rect x="40" y="120" width="160" height="90" rx="14" fill="#276749"/>
<text x="120" y="160" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">1 Base R</text>
<text x="120" y="188" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#e6f4ea">syntax</text>
<line x1="210" y1="165" x2="250" y2="165" stroke="#94a3a0" stroke-width="3"/>
<rect x="260" y="120" width="160" height="90" rx="14" fill="#1d4ed8"/>
<text x="340" y="160" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">2 tidyverse</text>
<text x="340" y="188" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#dbeafe">wrangling</text>
<line x1="430" y1="165" x2="470" y2="165" stroke="#94a3a0" stroke-width="3"/>
<rect x="480" y="120" width="160" height="90" rx="14" fill="#c2410c"/>
<text x="560" y="160" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">3 ggplot2</text>
<text x="560" y="188" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#ffedd5">plots</text>
<line x1="650" y1="165" x2="690" y2="165" stroke="#94a3a0" stroke-width="3"/>
<rect x="700" y="120" width="200" height="90" rx="14" fill="#0f766e"/>
<text x="800" y="160" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">4 modeling</text>
<text x="800" y="188" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" fill="#ccfbf1">stats</text>
<rect x="120" y="280" width="720" height="180" rx="16" fill="#fff" stroke="#d5e0da"/>
<text x="160" y="330" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a2e24">5 project practice</text>
<text x="160" y="370" font-family="Segoe UI,sans-serif" font-size="16" fill="#5a6f65">read -&gt; clean -&gt; plot -&gt; write conclusion</text>
<text x="160" y="410" font-family="Segoe UI,sans-serif" font-size="16" fill="#5a6f65">one mini analysis every week</text>
<circle cx="820" cy="360" r="18" fill="#f97316"><animate attributeName="cy" values="360;340;360" dur="1.8s" repeatCount="indefinite"/></circle>
</svg>
